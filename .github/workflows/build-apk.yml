name: Build HealthKu APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Copy APK to Root for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HealthKu.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HealthKu-APK
          path: HealthKu.apk
          retention-days: 30

      - name: Create Release and Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "HealthKu v1.0.${{ github.run_number }}"
          body: |
            ## 🌿 HealthKu APK (Asclepios UI)

            - File: **`HealthKu.apk`**
            - Kompatibel dengan semua Android (Android 8.0 s/d Android 15).
            - 100% Real data Health Connect.
          files: HealthKu.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
