name: Build HealthKu APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build Sideloadable Release APK
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee build_output.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Output-Log
          path: build_output.log
          retention-days: 7

      - name: Copy APK for Release
        run: |
          echo "=== Searching for APK ==="
          find app/build/outputs/apk -name "*.apk" -type f
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK generated! Displaying build log tail:"
            tail -n 100 build_output.log
            exit 1
          fi
          echo "Copying $APK_FILE to HealthKu.apk"
          cp "$APK_FILE" HealthKu.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HealthKu-APK
          path: HealthKu.apk
          retention-days: 30

      - name: Create Release and Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.${{ github.run_number }}
          name: "HealthKu Asclepios v1.3.${{ github.run_number }}"
          body: |
            ## 🌿 HealthKu - Asclepios Edition (Official Sideload APK)

            - File: **`HealthKu.apk`**
            - **Desain Presisi Asclepios**: 100% identik dengan rujukan visual (background Warm Ivory `#F7F4EB`, 3D Anatomical Heart, Stethoscope-Heart, Serene Sleep Avatar, dan Day Picker Strip).
            - **Dual Health Connect Permission Discovery**: Mendukung penuh Android 14+ (`ViewPermissionUsageActivity` alias) dan Android 13 kebawah sehingga nama aplikasi **HealthKu** muncul di daftar izin Health Connect.
            - **Sideload Ready**: Dibangun tanpa flag `testOnly` Android, siap dipasang langsung di smartphone tanpa error invalid package.
          files: HealthKu.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
