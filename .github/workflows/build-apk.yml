name: Build HealthKu APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Copy APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LumiHealth.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LumiHealth-APK
          path: LumiHealth.apk
          retention-days: 30

      - name: Create Release and Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: "LUMI AI Health Assistant v1.1.${{ github.run_number }}"
          body: |
            ## 🔮 LUMI - AI Health Assistant (Afterglow Edition)

            ### ✨ Apa yang Baru:
            - **Desain Baru LUMI AI Health Assistant** (Terinspirasi Afterglow Dribbble #27837777).
            - **LUMI Breathing AI Orb:** Animasi bola cahaya cerdas dinamis (*pulsing & breathing scale*).
            - **Modular Bento Grid:** Sleep Architecture (Periwinkle), Heart Rhythm (Coral), Movement (Amber), dan Vitals & SpO2 (Sage).
            - **Conversational Assistant:** Tab chat interaktif langsung dengan LUMI.
            - **Solusi Health Connect:** Tombol langsung untuk membuka pengaturan perizinan aplikasi di Health Connect.

            ### 🚀 Cara Install & Pakai:
            1. **Hapus / Uninstall versi lama** dari HP jika masih terpasang.
            2. Download file **`LumiHealth.apk`** di bawah ini langsung dari HP kamu.
            3. Buka file hasil unduhan, lalu klik **Install**.
            4. Buka **LUMI Health**, klik tombol **"Aktifkan Health Connect"** atau buka tab **Settings > Buka Izin di Health Connect Langsung**, lalu centang **"Izinkan semua / Allow all"**.
          files: LumiHealth.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
