name: Build HealthKu APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HealthKu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release and Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "HealthKu APK v1.0.${{ github.run_number }}"
          body: |
            ## 📱 HealthKu APK Siap Diinstall di HP Android

            ### 🚀 Cara Install & Pakai:
            1. Download file **`app-debug.apk`** di bawah ini langsung dari HP kamu.
            2. Buka file hasil unduhan, lalu klik **Install** (izinkan *Install unknown apps* jika diminta).
            3. Buka aplikasi **HealthKu**, lalu klik tombol **Sinkronkan dengan Health Connect**.
            4. Pastikan di aplikasi **GloryFit Pro** kamu sudah mengaktifkan sinkronisasi ke **Google Fit / Health Connect** (*Tab 'Saya / Me' > Layanan Pihak Ketiga*).
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
