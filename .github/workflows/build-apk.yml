name: Build HealthKu APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build Sideloadable Release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Copy APK for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk LumiHealth.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LumiHealth-APK
          path: LumiHealth.apk
          retention-days: 30

      - name: Create Release and Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: "LUMI Health v1.2.${{ github.run_number }}"
          body: |
            ## 🔮 LUMI AI Health Assistant (Installable Sideload Edition)

            - File: **`LumiHealth.apk`**
            - Dibangun sebagai **Release Sideload APK** (bebas dari flag `testOnly` Android yang menyebabkan error *package invalid*).
            - Siap dipasang langsung di HP Android.
          files: LumiHealth.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
