name: Build HealthKu APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Rename APK for Clear Download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/HealthKu-Asclepios.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HealthKu-APK
          path: app/build/outputs/apk/debug/HealthKu-Asclepios.apk
          retention-days: 30

      - name: Create Release and Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "HealthKu Asclepios Edition #${{ github.run_number }}"
          body: |
            ## 📱 HealthKu APK Siap Pasang di HP Android

            ### ⚠️ PENTING SEBELUM INSTALL:
            Jika di HP kamu masih terpasang aplikasi HealthKu versi lama, **HAPUS / UNINSTALL aplikasi lama terlebih dahulu**. Ini wajib dilakukan agar tidak terjadi konflik tanda tangan (signature mismatch) di Android!

            ### 🚀 Langkah Install:
            1. Download file **`HealthKu-Asclepios.apk`** di bawah ini langsung dari HP kamu.
            2. Buka file hasil unduhan, lalu klik **Install**.
            3. Buka **HealthKu**, lalu klik tombol **Tarik Data Real dari Health Connect**.
          files: app/build/outputs/apk/debug/HealthKu-Asclepios.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
